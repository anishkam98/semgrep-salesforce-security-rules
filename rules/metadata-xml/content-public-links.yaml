rules:
  - id: salesforce-content-distribution-enabled
    pattern: |
      <enableContentDistribution>true</enableContentDistribution>
    message: Salesforce Content Deliveries are enabled. Review external file-sharing and public exposure risk.
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - "Content.settings-meta.xml"

  - id: salesforce-public-links-enabled
    pattern: |
      <enableChatterFileLink>true</enableChatterFileLink>
    message: Salesforce Public Links are enabled. Public file links can expose files externally.
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - "Content.settings-meta.xml"

  - id: salesforce-public-links-for-portal-users-enabled
    pattern: |
      <enableContentDistForPortalUsers>true</enableContentDistForPortalUsers>
    message: Content Deliveries/Public Links are enabled for portal/community users. Review Experience Cloud and external-user exposure risk.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "Content.settings-meta.xml"

  - id: salesforce-content-delivery-password-default-off
    pattern: |
      <enableContentDistPwOptionsBit1>false</enableContentDistPwOptionsBit1>
      <enableContentDistPwOptionsBit2>false</enableContentDistPwOptionsBit2>
    message: Content Delivery password protection appears to default to OFF. Review whether password protection should be required.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "Content.settings-meta.xml"

  - id: salesforce-create-public-links-permission
    pattern: |
      <userPermissions>
        <enabled>true</enabled>
        <name>ChatterFileLink</name>
      </userPermissions>
    message: Profile or permission set grants Create Public Links permission. Review users assigned this access and external file-sharing risk.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "*.permissionset-meta.xml"
        - "*.profile-meta.xml"

  - id: salesforce-create-content-deliveries-permission
    pattern: |
      <userPermissions>
        <enabled>true</enabled>
        <name>CreateContentDeliveries</name>
      </userPermissions>
    message: Profile or permission set grants Create Content Deliveries permission. Review external file-sharing risk.
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - "*.permissionset-meta.xml"
        - "*.profile-meta.xml"

  - id: salesforce-distribute-from-personal-workspace
    pattern: |
      <userPermissions>
        <enabled>true</enabled>
        <name>DistributeFromPersWksp</name>
      </userPermissions>
    message: Profile or permission set allows distributing files from personal workspace. Review content delivery/public sharing exposure.
    severity: WARNING
    languages:
      - generic
    paths:
      include:
        - "*.permissionset-meta.xml"
        - "*.profile-meta.xml"